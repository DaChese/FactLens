<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FactLens</title>
  <link rel="stylesheet" href="sidebar.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="fl-header">
    <span class="fl-logo-text">FactLens</span>
    <div class="fl-header-right">
      <div class="fl-status">
        <span class="fl-status-dot" id="fl-status-dot"></span>
        <span class="fl-status-label" id="fl-status-label">Idle</span>
      </div>
      <button class="fl-btn" id="fl-check-btn" title="Re-check the current segment now" hidden>
        Check now
      </button>
      <button class="fl-btn" id="fl-stop-btn" title="Stop listening" hidden>
        Stop
      </button>
      <button class="fl-btn" id="fl-settings-btn" title="Open settings">
        Settings
      </button>
    </div>
  </header>

  <!-- ── Community Notes ────────────────────────────────────────────────── -->
  <section class="fl-section fl-section--notes">
    <div class="fl-section-header">
      <h2 class="fl-section-title">Community Notes</h2>
      <div class="fl-section-header-right">
        <span class="fl-outlet-badge" id="fl-outlet-badge" hidden></span>
        <button class="fl-btn fl-btn--small" id="fl-clear-notes" title="Clear notes">
          Clear
        </button>
      </div>
    </div>
    <div class="fl-notes-list" id="fl-notes-list">
      <p class="fl-placeholder">Press Check now while something is playing and a note about the story will appear here.</p>
    </div>
  </section>

  <script src="sidebar.js"></script>
</body>
</html>
